name: Deploy web to GitHub Pages

# Собирает Flutter web и публикует на GitHub Pages.
# Триггерится на push в main или web, плюс можно запустить вручную (Run workflow).
on:
  push:
    branches: [main, web]
  workflow_dispatch:

# Права, нужные официальному деплою на Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Не запускаем два деплоя параллельно.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9   # совпадает с локальной версией
          channel: stable
          cache: true

      - run: flutter pub get

      # base-href = /<имя-репозитория>/  (сайт живёт в подпапке /s3editor/)
      - run: flutter build web --release --base-href /s3editor/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
